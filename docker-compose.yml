services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_local"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    environment:

      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/app_local
      PYTHONUNBUFFERED: "1"
    ports:
      - "8010:8010"
    depends_on:
      db:
        condition: service_healthy


