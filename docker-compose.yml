version: "3.9"

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Si .env no tiene DATABASE_URL, por defecto usa Postgres local
      DATABASE_URL: ${DATABASE_URL:-postgres://testuser:testpass@neon-db:5432/testdb}
    depends_on:
      - neon-db

  neon-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 10s
      timeout: 5s
      retries: 5
