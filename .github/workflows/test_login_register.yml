name: Run auth_service tests

on:
  push:
    branches:
      - main
      - login-register
  pull_request:
    branches:
      - main
      - login-register

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: "test_secret"
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ENVIRONMENT: testing

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"

      - name: Instalar dependencias (desde raíz)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio

      - name: Lint con flake8
        working-directory: services/auth_service
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Ejecutar tests con pytest
        working-directory: services/auth_service
        env:
          PYTHONPATH: "${{ github.workspace }}/services/auth_service"
        run: |
          echo "Ejecutando pruebas unitarias (usando SQLite temporal)..."
          export PYTHONPATH="${PYTHONPATH}:$(pwd)"
          pytest -v --disable-warnings
