name: CI

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres -d app_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/app_test

      MIN_ELIGIBILITY_AGE: "18"
      PURCHASE_BASE_URL: https://tickets.example.com/checkout
      ADMIN_API_TOKEN: test-admin-token
      EMAIL_PROVIDER: stub
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Create schema
        run: |
          python - <<'PY'
          from services.api.database import Base, engine
          Base.metadata.create_all(bind=engine)
          print("Schema ready")
          PY

      - name: Run tests
        run: pytest -q
