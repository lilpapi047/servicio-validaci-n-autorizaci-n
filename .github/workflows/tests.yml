name: Tests y Auto Pull Request

on:
  push:
    branches-ignore:
      - 'main'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Configurar Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint con flake8
      run: |
        pip install flake8
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: false

    - name: Ejecutar pruebas unitarias
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        SECRET_KEY: test-secret-key-for-ci
        TWILIO_ACCOUNT_SID: test_sid
        TWILIO_AUTH_TOKEN: test_token
        TWILIO_FROM_EMAIL: test@example.com
        FRONTEND_URL: http://localhost:3000
      run: |
        pytest tests/unit/ -v --cov=servicio_validacion --cov-report=xml --cov-report=term-missing

    - name: Ejecutar pruebas de integración
      env:
        DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
        SECRET_KEY: test-secret-key-for-ci
        TWILIO_ACCOUNT_SID: test_sid
        TWILIO_AUTH_TOKEN: test_token
        TWILIO_FROM_EMAIL: test@example.com
        FRONTEND_URL: http://localhost:3000
      run: |
        pytest tests/integration/ -v

    - name: Verificar cobertura mínima
      run: |
        pip install coverage
        coverage report --fail-under=70

  create-pr:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    
    steps:
    - name: Checkout código
      uses: actions/checkout@v4

    - name: Crear Pull Request
      uses: repo-sync/pull-request@v2
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        source_branch: ${{ github.ref_name }}
        destination_branch: main
        pr_title: "🤖 Auto PR: ${{ github.ref_name }} (tests ✅)"
        pr_body: |
          ## Pull Request Automático
          
          ✅ Todos los tests pasaron exitosamente en `${{ github.ref_name }}`
          
          ### Checks completados:
          - ✅ Lint (flake8)
          - ✅ Tests unitarios
          - ✅ Tests de integración
          - ✅ Cobertura >= 70%
          
          **Workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        pr_label: "auto-pr,tests-passed"