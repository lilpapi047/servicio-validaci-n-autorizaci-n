name: CI Tests

on:
  push:
    branches:
      - main
      - develop
      - feature/**
      - integracion-*
  pull_request:
    branches:
      - main
      - develop
      - integracion-*

jobs:
  test:
    runs-on: ubuntu-latest

    # POSTGRES SERVICE 
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U postgres -d app_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # SQLite default (login-register)
      DATABASE_URL: "sqlite:///:memory:"
      # PostgreSQL override (criterios)
      POSTGRES_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/app_test"
      SECRET_KEY: "test_secret"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      ENVIRONMENT: "testing"
      PYTHONPATH: "${{ github.workspace }}"

    steps:
      
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python setup
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # Auto-detect if the microservice requires PostgreSQL

      - name: Detect DB and prepare schema if needed
        run: |
          echo "Detectando si se debe usar PostgreSQL..."
          if grep -R "postgresql" -n ./; then
            echo "Se detectó uso de PostgreSQL. Usando POSTGRES_URL."
            export DATABASE_URL=$POSTGRES_URL
            echo "DATABASE_URL=$DATABASE_URL" >> $GITHUB_ENV

            # Crear schema si existe módulo con Base/engine
            python - << 'EOF'
import os, importlib
try:
    from services.api.database import Base, engine
    Base.metadata.create_all(bind=engine)
    print("Schema creado correctamente.")
except Exception as e:
    print("No se encontró Base/engine o no era necesario.")
    print("Detalle:", e)
EOF
          else
            echo "No se detectó PostgreSQL → usando SQLite."
          fi

      # Lint
      - name: Run Flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # Run tests
      - name: Run Pytest
        run: |
          echo "Ejecutando pruebas..."
          pytest -v --disable-warnings
